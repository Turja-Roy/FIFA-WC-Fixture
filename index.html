<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIFA World Cup 2026 Tracker</title>
    <meta name="description" content="Track live scores, fixtures, and the bracket for the FIFA World Cup 2026.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-animated"></div>
    
    <header>
        <h1>World Cup 2026 Tracker</h1>
    </header>

    <div id="predict-bar">
        <button id="predict-toggle" class="btn-outline" type="button">🔮 Predict Mode: OFF</button>
        <button id="predict-publish" class="btn-outline hidden" type="button" title="Publish your predictions so others can see them">📢 Publish</button>
        <span id="predict-clear" class="predict-clear-link" title="Clear cached predict scores">Clear</span>
        <span id="predict-identity" class="predict-identity hidden"></span>
        <button id="auth-login-btn" class="btn-outline" type="button">🔑 Log in</button>
        <button id="auth-logout-btn" class="btn-outline hidden" type="button" title="Log out">Log out</button>
    </div>

    <div id="filter-bar">
        <div class="filter-bar-inner">
            <div class="filter-team-wrap">
                <input type="text" id="filter-team" placeholder="🔍 Search team..." autocomplete="off">
                <div id="team-suggestions" class="suggestions-dropdown hidden"></div>
            </div>
            <div class="filter-date-wrap">
                <label class="filter-label">From</label>
                <input type="date" id="filter-date-from">
            </div>
            <div class="filter-date-wrap">
                <label class="filter-label">To</label>
                <input type="date" id="filter-date-to">
            </div>
            <select id="filter-city" class="filter-select">
                <option value="">All Cities</option>
            </select>
            <select id="filter-group" class="filter-select">
                <option value="">All Groups</option>
                <option value="A">Group A</option>
                <option value="B">Group B</option>
                <option value="C">Group C</option>
                <option value="D">Group D</option>
                <option value="E">Group E</option>
                <option value="F">Group F</option>
                <option value="G">Group G</option>
                <option value="H">Group H</option>
                <option value="I">Group I</option>
                <option value="J">Group J</option>
                <option value="K">Group K</option>
                <option value="L">Group L</option>
            </select>
            <select id="filter-stage" class="filter-select">
                <option value="">All Stages</option>
                <option value="Group Stage">Group Stage</option>
                <option value="Round of 32">Round of 32</option>
                <option value="Round of 16">Round of 16</option>
                <option value="Quarter-finals">Quarter-finals</option>
                <option value="Semi-finals">Semi-finals</option>
                <option value="Final">Final</option>
            </select>
            <div class="status-chips">
                <button class="chip" data-status="completed" type="button">Completed</button>
                <button class="chip" data-status="live" type="button">Live</button>
                <button class="chip" data-status="upcoming" type="button">Upcoming</button>
            </div>
            <button id="filter-clear" class="filter-clear-btn" type="button">✕ Clear</button>
        </div>
        <div id="filter-status" class="filter-status hidden"></div>
    </div>

    <main>
        <section id="upcoming-matches-section">
            <h2>Upcoming Matches</h2>
            <div id="upcoming-container" class="upcoming-grid">
                <!-- Upcoming matches injected here -->
            </div>
        </section>

        <section id="groups-section">
            <h2>Group Stage</h2>
            <div id="groups-container" class="groups-grid">
                <!-- Groups will be dynamically injected here -->
            </div>
        </section>

        <section id="knockout-section">
            <h2>Knockout Stage</h2>
            <div class="bracket-wrapper">
                <div id="bracket-container" class="bracket">
                    <!-- Bracket will be injected here -->
                </div>
            </div>
        </section>

        <section id="standings-section">
            <h2>Group Standings</h2>
            <div id="standings-container" class="standings-grid">
                <!-- Standings will be injected here -->
            </div>
        </section>

        <section id="leaderboard-section">
            <h2>Prediction Leaderboard</h2>
            <div id="leaderboard-container" class="leaderboard">
                <!-- Leaderboard injected here -->
            </div>
        </section>
    </main>

    <footer>
        <p>Created for FIFA World Cup 2026. <a href="https://github.com/" target="_blank">Host yours on GitHub Pages</a></p>
    </footer>

    <!-- Tooltip Element -->
    <div id="tooltip" class="tooltip hidden"></div>

    <!-- Match Stats Overlay -->
    <div id="match-overlay" class="overlay hidden">
        <div class="overlay-backdrop"></div>
        <div class="overlay-content">
            <button class="overlay-close" type="button" aria-label="Close">&times;</button>
            <div id="overlay-body"></div>
        </div>
    </div>

    <!-- Auth Modal (login / signup) -->
    <div id="auth-modal" class="modal hidden">
        <div class="modal-backdrop"></div>
        <div class="modal-card">
            <button class="overlay-close" type="button" aria-label="Close">&times;</button>
            <h3 id="auth-title">Log in</h3>
            <p class="modal-sub" id="auth-sub">Log in to publish predictions and join the leaderboard.</p>
            <input type="text" id="auth-username" class="modal-input" maxlength="24" placeholder="Username" autocomplete="username" autocapitalize="off" spellcheck="false">
            <input type="password" id="auth-password" class="modal-input" placeholder="Password" autocomplete="current-password">
            <div id="auth-error" class="modal-error hidden"></div>
            <div class="auth-actions">
                <button id="auth-switch" class="auth-switch-link" type="button">Need an account? Sign up</button>
                <button id="auth-submit" class="btn-solid" type="button">Log in</button>
            </div>
        </div>
    </div>

    <!-- Match Predictions Reveal -->
    <div id="preds-modal" class="modal hidden">
        <div class="modal-backdrop"></div>
        <div class="modal-card">
            <button class="overlay-close" type="button" aria-label="Close">&times;</button>
            <h3 id="preds-title">Predictions</h3>
            <div id="preds-body"></div>
        </div>
    </div>

    <!-- Supabase config + client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        window.SUPABASE_URL = 'https://gnovifnpdghbwdkyhxvs.supabase.co';
        window.SUPABASE_KEY = 'sb_publishable_MDjUjUCbiPkrB0_o4Dde-g_ybmIeYTr';
        window.sb = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_KEY);
    </script>
    <script src="app.js"></script>
</body>
</html>
